site_name: vim-ai-follower
site_url: https://albertosca.github.io/vim-ai-follower/
site_description: Watch Claude Code type into your own Vim.
repo_url: https://github.com/albertosca/vim-ai-follower
docs_dir: guide/en
site_dir: .docs-build/en
theme:
  name: material
  language: en
  font:
    text: Atkinson Hyperlegible
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  custom_dir: overrides
  features:
    - navigation.tabs
extra_css:
  - stylesheets/gruvbox.css
extra:
  alternate:
    - name: English
      link: /vim-ai-follower/
      lang: en
    - name: Português
      link: /vim-ai-follower/pt/
      lang: pt
nav:
  - Home: index.md
  - LinkedIn: https://www.linkedin.com/in/albertosca/
