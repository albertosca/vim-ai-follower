name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install the package with dev + nvim extras
        run: pip install -e '.[nvim,dev]'

      # Lint and type-check live in lint.yml so each badge is backed by its
      # own workflow. The integration tests need a real tmux + Vim/Neovim and
      # are timing-sensitive; they run as a local/manual gate (see qa/). CI
      # runs the deterministic unit suite so the badge stays reliably green.
      # The floor is the unit suite's own measured coverage (99% branch on
      # 2026-09-21); the full suite with integration tests reaches 100%
      # locally, which is the number the project holds itself to.
      - name: Unit tests with coverage
        run: pytest -m "not integration" -q --cov=vim_ai_follower --cov-branch --cov-fail-under=98
