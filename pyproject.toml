[project]
name = "vim-ai-follower"
version = "0.1.0"
description = "Watch Claude Code edit files live in a tmux+Vim pane or directly in a running Neovim"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
claude-follow = "vim_ai_follower.cli:main"

[project.optional-dependencies]
nvim = ["pynvim>=0.5"]
dev = [
    "ruff>=0.6",
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "pynvim.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a real tmux and/or nvim binary on PATH",
    "pid_walk: opts out of conftest's no_pid_ancestry_walk neutraliser",
]

# The dev environment is uv-managed (.venv), resolved from uv.lock, so the
# weekly-update routine's dependency layer applies a bump (uv lock --upgrade
# + uv sync) to the same environment the suite then runs in. only-system
# keeps uv on an interpreter this machine already has instead of downloading
# a managed CPython; with .python-version pinned to 3.14 that resolves to
# asdf's python 3.14.6 -- measured by deleting .venv and reading
# `readlink -f .venv/bin/python3` after uv rebuilt it, not assumed.
[tool.uv]
python-preference = "only-system"
